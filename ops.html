<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Installation Management</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --teal: #3F7D6B;
      --amber: #C77D2E;
      --brick: #A33F35;
      --ink: #171B19;
      --nav-bg: #4B4B5A;
      --nav-bg-dark: #42424F;
      --page-bg: #E9EAF0;
      --border: #E1E1E8;
      --muted: #8B8B94;
      --view-green: #2FA36B;
      --link-blue: #2563EB;
    }

    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page-bg);
      font-family: 'IBM Plex Sans', ui-sans-serif, system-ui;
      color: var(--ink);
    }

    input, select, textarea, button {
      font-family: 'IBM Plex Sans', sans-serif;
    }

    button {
      cursor: pointer;
    }

    /* Layout & Navigation */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: var(--nav-bg);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .nav-menu {
      display: flex;
      background: var(--nav-bg);
      position: relative;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 7px;
      background: transparent;
      border: none;
      color: #EDEDF2;
      padding: 13px 16px;
      font-size: 14.5px;
      font-weight: 500;
    }

    .nav-item.active {
      background: rgba(255,255,255,0.10);
    }

    .dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      background: #FFFFFF;
      box-shadow: 0 8px 24px rgba(20,20,35,0.18);
      border-radius: 6px;
      padding: 14px;
      z-index: 20;
      min-width: 260px;
      display: none;
    }

    .dropdown.show {
      display: flex;
      gap: 22px;
    }

    /* Main Content */
    .container {
      padding: 26px 28px;
      max-width: 1180px;
      margin: 0 auto;
    }

    .card {
      background: #FFFFFF;
      border-radius: 6px;
      padding: 18px 20px;
      box-shadow: 0 1px 3px rgba(30,30,45,0.08);
    }

    /* Tables */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }

    th {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-weight: 500;
      font-size: 12px;
      white-space: nowrap;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      color: var(--ink);
    }

    .truncate {
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Pills & Tags */
    .pill-pending { background: #FAEEDA; color: #854F0B; font-size: 12px; padding: 3px 10px; border-radius: 999px; font-weight: 500; }
    .pill-answered { background: #E1F5EE; color: #085041; font-size: 12px; padding: 3px 10px; border-radius: 999px; font-weight: 500; }
    .pill-archived { background: #F1EFE8; color: #444441; font-size: 12px; padding: 3px 10px; border-radius: 999px; font-weight: 500; }
    .decision-approved { background: #E1F5EE; color: #085041; font-size: 11.5px; font-weight: 700; padding: 4px 11px; border-radius: 4px; text-transform: uppercase; }
    .decision-disapproved { background: #FBE4E1; color: #8C2C22; font-size: 11.5px; font-weight: 700; padding: 4px 11px; border-radius: 4px; text-transform: uppercase; }

    /* Forms */
    .form-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 13.5px;
      background: #FFFFFF;
      color: var(--ink);
      box-sizing: border-box;
      outline: none;
    }

    .form-textarea {
      resize: vertical;
      min-height: 76px;
      line-height: 1.5;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(23,27,25,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 60;
      padding: 20px;
    }

    .modal-content {
      background: #fff;
      border-radius: 10px;
      width: 100%;
      max-width: 540px;
      box-shadow: 0 24px 64px rgba(20,20,35,0.28);
      overflow: hidden;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 28px;
      background: var(--ink);
      color: #F2F0E9;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // --- Seed Data & Constants ---
    const seedRequests = [
      { id: "REQ-1042", requester: "Marisol Ibarra", department: "Finance", equipment: "Dual monitor + dock", what: "REQUEST FOR DUAL MONITOR AND DOCK SETUP FOR NEW HIRE AT FINANCE BAY.", location: "3F - Finance Bay", priority: "High", dateNeeded: "2026-09-08", notes: "New hire starts Monday.", status: "pending", submitted: "2026-09-01", submittedTime: "09:14 AM" },
      { id: "REQ-1041", requester: "Deo Santos", department: "Legal", equipment: "Laptop replacement", what: "REQUEST FOR LAPTOP REPLACEMENT DUE TO OVERHEATING AT LEGAL SUITE.", location: "5F - Legal Suite", priority: "Medium", dateNeeded: "2026-09-10", notes: "Current unit overheating.", status: "pending", submitted: "2026-09-01", submittedTime: "11:02 AM" },
      { id: "20260421-103856", requester: "Fradelyn Cacho Bacani", department: "Others", equipment: "Request", what: "REQUESTING YOUR GOOD OFFICE 3 ROLLS OF THERMAL PAPER FOR KIOSK.", location: "Kiosk", priority: "Low", dateNeeded: "2026-04-25", notes: "Kiosk consumables running low.", status: "pending", submitted: "2026-04-21", submittedTime: "10:38 AM" },
      { id: "REQ-1040", requester: "Grace Uy", department: "Marketing", equipment: "Conference room AV", what: "REQUEST FOR CONFERENCE ROOM AV SETUP FOR CLIENT DEMOS AT ROOM 204.", location: "2F - Room 204", priority: "Low", dateNeeded: "2026-08-15", notes: "For client demos.", status: "answered", decision: "APPROVED", submitted: "2026-08-28", submittedTime: "04:05 PM" },
      { id: "REQ-1039", requester: "Ramon Cruz", department: "Ops", equipment: "Network switch", what: "REQUEST FOR NETWORK SWITCH UPGRADE AT SERVER ROOM.", location: "B1 - Server Room", priority: "High", dateNeeded: "2026-08-30", notes: "Port capacity upgrade.", status: "answered", decision: "APPROVED", submitted: "2026-08-25", submittedTime: "08:30 AM" },
      { id: "20260220-133229", requester: "Cecilia Casabuena Atanacio", department: "Others", equipment: "Request", what: "REQUESTING ADDITIONAL BOND PAPER SUPPLY FOR THE BRANCH.", location: "Branch", priority: "Low", dateNeeded: "2026-02-25", notes: "Recurring office supply.", status: "answered", decision: "DISAPPROVED", submitted: "2026-02-20", submittedTime: "01:32 PM" },
      { id: "REQ-1038", requester: "Bea Fernandez", department: "HR", equipment: "Printer install", what: "REQUEST FOR SHARED PRINTER INSTALL AT HR WING.", location: "4F - HR Wing", priority: "Medium", dateNeeded: "2026-08-20", notes: "Shared printer for floor.", status: "archived", submitted: "2026-08-10", submittedTime: "10:00 AM" },
      { id: "REQ-1037", requester: "Noel Villareal", department: "IT", equipment: "Workstation setup", what: "REQUEST FOR TEST BENCH WORKSTATION REBUILD.", location: "6F - IT Lab", priority: "Low", dateNeeded: "2026-08-12", notes: "Test bench rebuild.", status: "archived", submitted: "2026-08-05", submittedTime: "03:15 PM" },
    ];

    const CATEGORY_TYPES = {
      SOFTWARE: ["WINDOWS UPDATE", "ANTIVIRUS INSTALLATION", "MS OFFICE INSTALLATION", "SYSTEM APPLICATION INSTALLATION"],
      USER: ["NEW USER ACCOUNT", "USER ACCESS RIGHTS UPDATE", "PASSWORD RESET", "ACCOUNT DEACTIVATION"],
      CONNECTIVITY: ["LAN SETUP", "WI-FI ACCESS CONFIGURATION", "VPN ACCESS SETUP", "INTERNET LINE INSTALLATION"],
      HARDWARE: ["DESKTOP INSTALLATION", "PRINTER INSTALLATION", "NETWORK SWITCH INSTALLATION", "MONITOR INSTALLATION"],
    };

    const HOW_TEXT = "RECOMMENDING APPROVAL OF IT OPERATIONS UNIT HEAD.";
    const APPROVAL_CHAIN = ["PRESIDENT & CEO", "ITSD HEAD", "IT OPERATIONS UNIT HEAD", "DEPARTMENT HEAD"];
    const MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const MONTH_ABBR = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const WEEKDAYS = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];

    const pageTitles = {
      dashboard: "Dashboard", request: "Request", "request-form": "Request",
      answered: "Answered", archives: "Archives", approval: "Approval",
      general: "General", users: "Users & roles"
    };

    // --- State Management ---
    let state = {
      selected: "dashboard",
      openMenu: null,
      requests: [...seedRequests],
      toast: null,
      modalEntry: null,
      form: { category: "", type: "", what: "", who: "", why: "", where: "", when: "", how: HOW_TEXT },
      autoWhat: true,
      formError: "",
      listSearch: "",
      listPageSize: 10,
      listPage: 1,
      listSort: { key: "submitted", dir: "desc" },
      viewYear: 2026,
      viewMonth: 8, // September
      today: { year: 2026, month: 8, day: 3 }
    };

    // --- Helpers ---
    function formatDateTime(dateStr, timeStr) {
      if (!dateStr) return "—";
      const [y, m, d] = dateStr.split("-").map(Number);
      return `${MONTH_ABBR[m - 1]} ${d}, ${y}${timeStr ? " " + timeStr : ""}`;
    }

    function buildCalendarGrid(year, month) {
      const startWeekday = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysInPrevMonth = new Date(year, month, 0).getDate();
      const cells = [];
      for (let i = 0; i < startWeekday; i++) cells.push({ day: daysInPrevMonth - startWeekday + 1 + i, inMonth: false, dateStr: null });
      for (let day = 1; day <= daysInMonth; day++) cells.push({ day, inMonth: true, dateStr: `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}` });
      while (cells.length % 7 !== 0 || cells.length < 42) cells.push({ day: cells.length - (startWeekday + daysInMonth) + 1, inMonth: false, dateStr: null });
      return cells.slice(0, 42);
    }

    // --- Event Dispatchers ---
    window.goTo = (view) => { state.selected = view; state.openMenu = null; render(); };
    window.toggleMenu = (menu) => { state.openMenu = state.openMenu === menu ? null : menu; render(); };
    window.closeMenu = () => { state.openMenu = null; render(); };
    window.setListPageSize = (size) => { state.listPageSize = Number(size); state.listPage = 1; render(); };
    window.setListSearch = (val) => { state.listSearch = val; state.listPage = 1; render(); };
    window.setListPage = (page) => { state.listPage = page; render(); };
    window.toggleSort = (key) => {
      state.listSort = state.listSort.key === key 
        ? { key, dir: state.listSort.dir === "asc" ? "desc" : "asc" } 
        : { key, dir: "asc" };
      render();
    };
    window.changeMonth = (delta) => {
      state.viewMonth += delta;
      if (state.viewMonth > 11) { state.viewMonth = 0; state.viewYear++; }
      else if (state.viewMonth < 0) { state.viewMonth = 11; state.viewYear--; }
      render();
    };
    window.goToday = () => { state.viewYear = state.today.year; state.viewMonth = state.today.month; render(); };

    window.updateForm = (key, val) => {
      state.form[key] = val;
      if (key === 'category') state.form.type = "";
      if (key === 'what') state.autoWhat = false;
      
      if (state.autoWhat && (key === 'type' || key === 'where' || key === 'category')) {
        state.form.what = `REQUEST FOR INSTALLATION OF ${state.form.type || "[SPECIFY IT ASSET]"} AT ${state.form.where ? state.form.where.toUpperCase() : "[BRANCH]"} BRANCH.`;
      }
      render();
    };

    window.submitRequest = () => {
      const f = state.form;
      if (!f.category || !f.type || !f.who || !f.why || !f.where || !f.when || !f.how) {
        state.formError = "Fill in every field before submitting.";
        render(); return;
      }
      const id = `REQ-${1043 + state.requests.filter(r => r.id.startsWith("REQ-1")).length}`;
      state.requests.unshift({
        id, category: f.category, type: f.type, what: f.what, who: f.who, why: f.why, where: f.where, when: f.when, how: f.how,
        department: f.category, equipment: f.type, requester: f.who, location: f.where, priority: "Medium", dateNeeded: f.when, notes: f.why,
        status: "pending", submitted: new Date().toISOString().slice(0, 10), submittedTime: new Date().toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" })
      });
      state.form = { category: "", type: "", what: "", who: "", why: "", where: "", when: "", how: HOW_TEXT };
      state.autoWhat = true; state.formError = ""; state.selected = "approval"; showToast("Request submitted");
    };

    window.openModal = (id, mode) => { state.modalEntry = { request: state.requests.find(r => r.id === id), mode }; render(); };
    window.closeModal = () => { state.modalEntry = null; render(); };
    window.decideRequest = (decision) => {
      const req = state.modalEntry.request;
      req.status = "answered"; req.decision = decision;
      state.modalEntry = null;
      showToast(decision === "APPROVED" ? "Request approved" : "Request disapproved");
      render();
    };

    window.showToast = (msg) => {
      state.toast = msg; render();
      setTimeout(() => { state.toast = null; render(); }, 2200);
    };

    // --- Render Core ---
    function render() {
      const app = document.getElementById("app");
      
      const pending = state.requests.filter(r => r.status === "pending");
      const answered = state.requests.filter(r => r.status === "answered");
      const archived = state.requests.filter(r => r.status === "archived");
      
      app.innerHTML = `
        <!-- Top Nav -->
        <div class="top-bar">
          <div style="display: flex; align-items: center; gap: 12px;">
            <div style="width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #7FB89A, var(--teal) 70%); display: flex; align-items: center; justify-content: center;">
              <i data-lucide="clipboard-list" color="#F2F0E9"></i>
            </div>
            <span style="font-size: 19px; font-weight: 600; color: #F5F4F0;">IT Installation Management</span>
          </div>
          <button style="width: 34px; height: 34px; border-radius: 50%; background: #5A5A69; border: 1px solid rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center;">
            <i data-lucide="user" color="#EDEDF2" width="17"></i>
          </button>
        </div>

        <!-- Menus -->
        <div class="nav-menu">
          <div style="position:relative">
            <button class="nav-item ${state.selected === 'dashboard' ? 'active' : ''}" onclick="goTo('dashboard')">
              <i data-lucide="layout-dashboard" width="16"></i> Dashboard
            </button>
          </div>
          <div style="position:relative">
            <button class="nav-item ${['request','request-form','answered','archives','approval'].includes(state.selected) ? 'active' : ''}" onclick="toggleMenu('ops')">
              <i data-lucide="clipboard-list" width="16"></i> OPS <i data-lucide="chevron-down" width="14"></i>
            </button>
            <div class="dropdown ${state.openMenu === 'ops' ? 'show' : ''}" style="flex-direction: column;">
               <div style="color: var(--muted); font-size: 11.5px; font-weight: 500; margin-bottom: 10px; text-transform: uppercase;">IT Installation</div>
               <div style="display: flex; gap: 22px;">
                 <div>
                   <div style="font-size: 11.5px; color: var(--muted); margin-bottom: 8px;"><i data-lucide="file-text" width="13"></i> FORMS</div>
                   <button onclick="goTo('request')" style="display: block; width: 100%; text-align: left; background: transparent; border: none; padding: 7px 8px; font-size: 13.5px;">Request</button>
                 </div>
                 <div>
                   <div style="font-size: 11.5px; color: var(--muted); margin-bottom: 8px;"><i data-lucide="folder-open" width="13"></i> RECORDS</div>
                   <button onclick="goTo('answered')" style="display: block; width: 100%; text-align: left; background: transparent; border: none; padding: 7px 8px; font-size: 13.5px;">Answered</button>
                   <button onclick="goTo('archives')" style="display: block; width: 100%; text-align: left; background: transparent; border: none; padding: 7px 8px; font-size: 13.5px;">Archives</button>
                 </div>
                 <div>
                   <div style="font-size: 11.5px; color: var(--muted); margin-bottom: 8px;"><i data-lucide="check-square" width="13"></i> ACTIONS</div>
                   <button onclick="goTo('approval')" style="display: block; width: 100%; text-align: left; background: transparent; border: none; padding: 7px 8px; font-size: 13.5px;">Approval</button>
                 </div>
               </div>
            </div>
          </div>
          <div style="position:relative">
            <button class="nav-item ${['general','users'].includes(state.selected) ? 'active' : ''}" onclick="toggleMenu('settings')">
              <i data-lucide="settings" width="16"></i> Settings <i data-lucide="chevron-down" width="14"></i>
            </button>
            <div class="dropdown ${state.openMenu === 'settings' ? 'show' : ''}">
              <div>
                <div style="font-size: 11.5px; color: var(--muted); margin-bottom: 8px;"><i data-lucide="settings" width="13"></i> WORKSPACE</div>
                <button onclick="goTo('general')" style="display: block; width: 100%; text-align: left; background: transparent; border: none; padding: 7px 8px; font-size: 13.5px;">General</button>
                <button onclick="goTo('users')" style="display: block; width: 100%; text-align: left; background: transparent; border: none; padding: 7px 8px; font-size: 13.5px;">Users & roles</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Main Container -->
        <div class="container">
          ${!["request", "request-form", "approval", "answered"].includes(state.selected) ? `<h1 style="font-size: 26px; font-weight: 400; color: #6B6B76; margin: 0 0 18px 0;">${pageTitles[state.selected]}</h1>` : ''}
          
          ${state.selected === 'dashboard' ? renderDashboard(pending, answered, archived) : ''}
          ${state.selected === 'request' ? renderDataTable('IT Installation Request', state.requests, ['id','displayType','displayCategory','displayWhat','submitted','displayHolder','status']) : ''}
          ${state.selected === 'request-form' ? renderRequestForm() : ''}
          ${state.selected === 'approval' ? renderDataTable('IT Installation Approval', pending, ['id','equipment','department','what','submitted','requester'], true, 'approval') : ''}
          ${state.selected === 'answered' ? renderDataTable('IT Installation Answered', answered, ['id','equipment','department','submitted','requester','decision'], true, 'view') : ''}
          ${state.selected === 'archives' ? renderArchives(archived) : ''}
          ${state.selected === 'general' || state.selected === 'users' ? renderSettings() : ''}
        </div>
        
        ${state.modalEntry ? renderModal() : ''}
        ${state.toast ? `<div class="toast"><i data-lucide="check-circle-2" color="var(--teal)" width="15"></i> ${state.toast}</div>` : ''}
      `;
      
      lucide.createIcons();
    }

    function renderDashboard(pending, answered, archived) {
      const cells = buildCalendarGrid(state.viewYear, state.viewMonth);
      const upcoming = state.requests.filter(r => r.status !== "archived").sort((a, b) => (a.dateNeeded > b.dateNeeded ? 1 : -1)).slice(0, 6);

      return `
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
          <span style="font-size: 14px;">ITSD Department | IT Installation Management</span>
          <span style="font-size: 13px; color: var(--muted); letter-spacing: 0.3px;">FIELDHOUSE OPERATIONS — FACILITIES & TECHNOLOGY</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px;">
          ${[
            { l: "Total requests", v: state.requests.length, i: "inbox" },
            { l: "Pending approval", v: pending.length, i: "clock" },
            { l: "Answered", v: answered.length, i: "check-circle-2" },
            { l: "Archived", v: archived.length, i: "archive" }
          ].map(k => `
            <div style="background: #FFF; border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px;">
              <div style="display: flex; justify-content: space-between;"><span style="font-size: 12px; color: var(--muted);">${k.l}</span><i data-lucide="${k.i}" color="var(--teal)" width="15"></i></div>
              <div style="font-size: 28px; font-weight: 600; margin-top: 10px;">${k.v}</div>
            </div>
          `).join('')}
        </div>
        <div style="display: grid; grid-template-columns: 2.3fr 1fr; gap: 18px;">
          <div class="card" style="padding: 18px 20px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 16px;">
              <div>
                <button onclick="changeMonth(-1)" style="border:none;background:transparent;font-size:16px;">‹</button>
                <button onclick="changeMonth(1)" style="border:none;background:transparent;font-size:16px;">›</button>
              </div>
              <h2 style="font-size: 21px; margin: 0;">${MONTH_NAMES[state.viewMonth]} ${state.viewYear}</h2>
              <button onclick="goToday()" style="border: 1px solid var(--border); background: #FFF; border-radius: 999px; padding: 7px 16px;">Today</button>
            </div>
            <div style="display: grid; grid-template-columns: repeat(7, 1fr);">${WEEKDAYS.map(d => `<div style="font-size: 11px; color: var(--muted); text-align: center; padding: 6px 0;">${d}</div>`).join('')}</div>
            <div style="display: grid; grid-template-columns: repeat(7, 1fr); border: 1px solid var(--border); border-radius: 6px;">
              ${cells.map((c, i) => {
                const isToday = c.inMonth && state.viewYear === state.today.year && state.viewMonth === state.today.month && c.day === state.today.day;
                const events = c.dateStr ? state.requests.filter(r => r.dateNeeded === c.dateStr) : [];
                return `<div style="min-height: 78px; padding: 8px; border-right: ${i%7 < 6 ? '1px solid var(--border)' : 'none'}; border-bottom: 1px solid var(--border); background: ${i%7===0||i%7===6 ? '#F6F6F9' : '#FFF'};">
                  <span style="${isToday ? 'display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--teal);color:#fff;font-size:12.5px;font-weight:600;' : `font-size:12.5px;color:${c.inMonth?'var(--ink)':'#C6C6CE'}`}">
                    ${c.day}
                  </span>
                  ${events.map(e => `<div style="font-size:10px; margin-top:4px; padding:2px 5px; border-radius:4px; background:${e.status==='pending'?'#FAEEDA':e.status==='answered'?'#E1F5EE':'#F1EFE8'}; color:${e.status==='pending'?'#854F0B':e.status==='answered'?'#085041':'#444441'}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${e.equipment}</div>`).join('')}
                </div>`;
              }).join('')}
            </div>
          </div>
          <div class="card" style="padding: 0; overflow: hidden;">
            <div style="padding: 16px 18px; border-bottom: 1px solid var(--border); font-size: 12.5px; font-weight: 700;">INSTALLATION OVERVIEW</div>
            <div style="padding: 6px 10px;">
              ${upcoming.map(r => `
                <div style="padding: 10px 8px; border-bottom: 1px solid var(--border);">
                  <div style="display:flex; justify-content:space-between;">
                    <span style="font-size: 13px; font-weight: 500;">${r.equipment}</span>
                    <span class="pill-${r.status}">${r.status.charAt(0).toUpperCase() + r.status.slice(1)}</span>
                  </div>
                  <div style="font-size: 12px; color: var(--muted); margin-top: 3px;">${r.dateNeeded} · ${r.requester}</div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderDataTable(title, rawRows, cols, hasAction, actionMode) {
      let rows = rawRows.map(r => ({
        ...r,
        displayType: r.type || r.equipment || "—",
        displayCategory: r.category || r.department || "—",
        displayWhat: r.what || r.notes || "—",
        displayHolder: r.requester || "—"
      }));

      if (state.listSearch) {
        const q = state.listSearch.toLowerCase();
        rows = rows.filter(r => JSON.stringify(Object.values(r)).toLowerCase().includes(q));
      }

      const { key, dir } = state.listSort;
      rows.sort((a, b) => {
        let av = a[key] || "", bv = b[key] || "";
        if (av < bv) return dir === 'asc' ? -1 : 1;
        if (av > bv) return dir === 'asc' ? 1 : -1;
        return 0;
      });

      const total = rows.length;
      const start = (state.listPage - 1) * state.listPageSize;
      const pageRows = rows.slice(start, start + state.listPageSize);
      const totalPages = Math.ceil(total / state.listPageSize);

      const getPill = (status) => `<span class="pill-${status}">${status.charAt(0).toUpperCase() + status.slice(1)}</span>`;
      const getDecision = (dec) => `<span class="decision-${dec.toLowerCase()}">${dec}</span>`;

      return `
        <div style="font-size: 13px; color: var(--muted); margin-bottom: 14px;">Forms / IT Installation / ${title.split(' ').pop()}</div>
        <div class="card" style="padding:0; overflow:hidden;">
          <div style="display:flex; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--border);">
            <span style="font-size:15px; font-weight:600;">${title}</span>
            ${title === 'IT Installation Request' ? `<button onclick="goTo('request-form')" style="background:var(--teal); color:#fff; border:none; border-radius:6px; padding:8px 16px; font-size:13.5px; display:inline-flex; align-items:center; gap:6px;"><i data-lucide="plus" width="15"></i> Create</button>` : ''}
          </div>
          <div style="display:flex; justify-content:space-between; padding:16px 20px;">
            <div style="font-size:13.5px;">Show <select class="form-input" style="width:auto; display:inline-block; padding:5px 8px;" onchange="setListPageSize(this.value)"><option ${state.listPageSize==10?'selected':''}>10</option><option ${state.listPageSize==25?'selected':''}>25</option></select> entries</div>
            <div style="font-size:13.5px;">Search: <input class="form-input" style="width:200px; display:inline-block; padding:6px 10px;" value="${state.listSearch}" oninput="setListSearch(this.value)" /></div>
          </div>
          <div style="overflow-x:auto;">
            <table>
              <thead>
                <tr>
                  ${hasAction || title === 'IT Installation Request' ? `<th>Action</th>` : ''}
                  ${cols.map(c => `<th onclick="toggleSort('${c}')" style="cursor:pointer;">${c.toUpperCase()}</th>`).join('')}
                </tr>
              </thead>
              <tbody>
                ${pageRows.map(r => `
                  <tr>
                    ${title === 'IT Installation Request' ? `<td><button onclick="showToast('Viewing ${r.id}')" style="background:transparent;border:none;color:var(--muted);"><i data-lucide="eye" width="15"></i></button></td>` : ''}
                    ${hasAction ? `<td><button onclick="openModal('${r.id}', '${actionMode}')" style="background:var(--view-green);color:#fff;border:none;border-radius:4px;padding:6px 16px;font-size:12.5px;font-weight:600;">View</button></td>` : ''}
                    ${cols.map(c => `
                      <td class="${c==='displayWhat'||c==='what'?'truncate':''}">
                        ${c==='status'?getPill(r.status) : c==='decision'?getDecision(r.decision) : r[c]}
                      </td>
                    `).join('')}
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
          <div style="display:flex; justify-content:space-between; padding:14px 20px;">
            <span style="font-size:13px; color:var(--muted);">Showing ${total?start+1:0} to ${Math.min(start+state.listPageSize, total)} of ${total} entries</span>
            <div style="display:flex; gap:8px;">
              <button onclick="setListPage(${Math.max(1, state.listPage - 1)})" style="padding:6px 14px; border:1px solid var(--border); border-radius:6px; background:#fff;">Previous</button>
              <button onclick="setListPage(${Math.min(totalPages, state.listPage + 1)})" style="padding:6px 14px; border:1px solid var(--border); border-radius:6px; background:#fff;">Next</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderRequestForm() {
      const f = state.form;
      return `
        <div style="max-width: 760px;">
          <div style="font-size: 13px; color: var(--muted); margin-bottom: 14px; display: flex; align-items: center; gap: 6px;">
            <button onclick="goTo('request')" style="background: transparent; border: none; padding: 0; color: #3A3A44; display: flex; align-items: center; gap: 3px;"><i data-lucide="chevron-left" width="13"></i> Forms</button> / IT Installation / <span onclick="goTo('request')" style="cursor:pointer; color:#3A3A44;">Request</span> / New request
          </div>
          <p style="color: var(--muted); font-size: 13.5px; margin: -2px 0 18px 0;">Submitted requests appear in Actions → Approval for review.</p>
          <div class="card">
            <div style="font-size: 15px; font-weight: 600; margin-bottom: 20px;">Request form</div>
            
            ${formField("Category", true, "", `<select class="form-input" onchange="updateForm('category', this.value)"><option value="">Choose one:</option>${Object.keys(CATEGORY_TYPES).map(c => `<option value="${c}" ${f.category===c?'selected':''}>${c}</option>`).join('')}</select>`)}
            ${formField("Type", true, "", `<select class="form-input" onchange="updateForm('type', this.value)" ${!f.category?'disabled':''} style="opacity:${f.category?1:0.55}"><option value="">Choose one:</option>${(CATEGORY_TYPES[f.category]||[]).map(t => `<option value="${t}" ${f.type===t?'selected':''}>${t}</option>`).join('')}</select>`)}
            ${formField("What", true, "Detailed information about the request", `<textarea class="form-input form-textarea" oninput="updateForm('what', this.value)">${f.what}</textarea>`)}
            ${formField("Who", true, "Parties involved", `<textarea class="form-input form-textarea" placeholder="Personnel name, position, department" oninput="updateForm('who', this.value)">${f.who}</textarea>`)}
            ${formField("Why", true, "Justification", `<textarea class="form-input form-textarea" placeholder="e.g. new personnel, branch opening, etc." oninput="updateForm('why', this.value)">${f.why}</textarea>`)}
            ${formField("Where", true, "Specify place", `<textarea class="form-input form-textarea" placeholder="Branch name / location" oninput="updateForm('where', this.value)">${f.where}</textarea>`)}
            ${formField("When", true, "Specify date", `<input type="date" class="form-input" value="${f.when}" onchange="updateForm('when', this.value)">`)}
            ${formField("How", true, "Standing recommendation on file", `<textarea class="form-input form-textarea" oninput="updateForm('how', this.value)">${f.how}</textarea>`)}
            
            <div style="margin-top: 8px; padding-top: 20px; border-top: 1px solid var(--border);">
              <div style="font-size: 12px; color: var(--muted); margin-bottom: 8px;">RECOMMENDATION OR APPROVAL OF:</div>
              <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                ${APPROVAL_CHAIN.map(role => `<span style="font-size:12px; font-weight:500; background:#F1F1F5; border:1px solid var(--border); border-radius:999px; padding:5px 12px;">${role}</span>`).join('')}
              </div>
            </div>
            
            ${state.formError ? `<div style="color: var(--brick); font-size: 12.5px; margin-top: 14px;">${state.formError}</div>` : ''}
            <button onclick="submitRequest()" style="margin-top: 16px; background: var(--teal); color: #fff; border: none; border-radius: 6px; padding: 9px 18px; font-size: 13.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px;"><i data-lucide="plus" width="15"></i> Submit request</button>
          </div>
        </div>
      `;
    }

    function formField(label, required, hint, html) {
      return `
        <div style="display: grid; grid-template-columns: 150px 1fr; gap: 24px; align-items: start; margin-bottom: 22px;">
          <div>
            <div style="font-size: 13.5px; color: #1F3A5F; font-weight: 500;">${label}${required ? '<span style="color:#A33F35"> *</span>' : ''}</div>
            ${hint ? `<div style="font-size: 12px; color: var(--muted); margin-top: 3px;">${hint}</div>` : ''}
          </div>
          <div>${html}</div>
        </div>
      `;
    }

    function renderArchives(archived) {
      return `
        <p style="color: var(--muted); font-size: 13.5px; margin: -10px 0 18px 0;">Closed, rejected, or superseded requests.</p>
        <div class="card" style="padding:0; overflow:hidden;">
          <table>
            <thead><tr><th>ID</th><th>REQUESTER</th><th>DEPARTMENT</th><th>EQUIPMENT</th><th>SUBMITTED</th><th>STATUS</th></tr></thead>
            <tbody>
              ${archived.map(r => `<tr><td>${r.id}</td><td>${r.requester}</td><td>${r.department}</td><td>${r.equipment}</td><td>${r.submitted}</td><td><span class="pill-archived">Archived</span></td></tr>`).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderSettings() {
      if (state.selected === 'general') {
        return `
          <div style="max-width: 520px;">
            <p style="color: var(--muted); font-size: 13.5px; margin: -10px 0 18px 0;">Workspace preferences for this console.</p>
            <div class="card">
              ${[{l:'Workspace name',v:'IT Installation Management'},{l:'Default department',v:'IT'},{l:'Time zone',v:'Asia/Manila (UTC+8)'}].map(row => `
                <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); font-size:13.5px;">
                  <span style="color:var(--muted)">${row.l}</span><span>${row.v}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
      return `
        <p style="color: var(--muted); font-size: 13.5px; margin: -10px 0 18px 0;">People with access to this console.</p>
        <div class="card" style="padding:0; overflow:hidden;">
          <table>
            <thead><tr><th>NAME</th><th>ROLE</th><th>ACCESS SCOPE</th></tr></thead>
            <tbody>
              <tr><td>J. Dela Cruz</td><td>Ops coordinator</td><td>Full access</td></tr>
              <tr><td>R. Alonzo</td><td>IT technician</td><td>Records only</td></tr>
              <tr><td>P. Santos</td><td>Approver</td><td>Actions only</td></tr>
            </tbody>
          </table>
        </div>
      `;
    }

    function renderModal() {
      const { request: r, mode } = state.modalEntry;
      return `
        <div class="modal-overlay" onclick="closeModal()">
          <div class="modal-content" onclick="event.stopPropagation()">
            <div style="display:flex; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border);">
              <div><div style="font-size:15px; font-weight:600;">${r.id}</div><div style="font-size:12px; color:var(--muted); margin-top:2px;">Request details</div></div>
              <button onclick="closeModal()" style="background:transparent; border:none; color:var(--muted);"><i data-lucide="x" width="18"></i></button>
            </div>
            <div>
              ${modalRow("Type", r.equipment)}
              ${modalRow("Category", r.department)}
              ${modalRow("What", r.what)}
              ${modalRow("Who", r.requester)}
              ${modalRow("Where", r.location)}
              ${modalRow("Request date", formatDateTime(r.submitted, r.submittedTime))}
              ${modalRow("Needed by", r.dateNeeded, !r.decision)}
              ${r.decision ? modalRow("Status", `<span class="decision-${r.decision.toLowerCase()}">${r.decision}</span>`, true) : ''}
            </div>
            ${mode === 'approval' ? `
              <div style="display:flex; gap:10px; padding:16px 20px; border-top:1px solid var(--border); justify-content:flex-end;">
                <button onclick="decideRequest('DISAPPROVED')" style="background:#FBE4E1; color:#8C2C22; border:none; border-radius:6px; padding:9px 16px; font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:6px;"><i data-lucide="x-circle" width="15"></i> Disapprove</button>
                <button onclick="decideRequest('APPROVED')" style="background:var(--teal); color:#fff; border:none; border-radius:6px; padding:9px 16px; font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:6px;"><i data-lucide="check-circle-2" width="15"></i> Approve</button>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    function modalRow(label, content, last) {
      return `
        <div style="display:flex; border-bottom:${last ? 'none' : '1px solid var(--border)'}">
          <div style="width:110px; flex-shrink:0; padding:12px 14px; background:#F6F6F9; font-size:11.5px; font-weight:700; color:#3A3A44; letter-spacing:0.4px;">${label.toUpperCase()}</div>
          <div style="flex:1; padding:10px 14px; display:flex; align-items:center; font-size:13.5px;">${content}</div>
        </div>
      `;
    }

    // Initial render
    document.addEventListener("DOMContentLoaded", render);
  </script>
</body>
</html>
