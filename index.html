<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Installation Management </title>
  <!-- Linked style.css -->
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="top-bar">
    <div class="brand">
      <div class="brand-mark">
        <i data-lucide="clipboard-list" color="#F2F0E9"></i>
      </div>
      <span>IT Installation Management</span>
    </div>
    <button class="profile-button" aria-label="Open profile">
      <i data-lucide="user" color="#EDEDF2" width="17"></i>
    </button>
  </div>

  <nav class="nav-menu" aria-label="Main navigation">
    <div class="nav-group">
      <button id="dashboard-nav" class="nav-item" onclick="goTo('dashboard')">
        <i data-lucide="layout-dashboard" width="16"></i> Dashboard
      </button>
    </div>
    <div class="nav-group">
      <button id="ops-nav" class="nav-item" onclick="toggleMenu('ops')">
        <i data-lucide="clipboard-list" width="16"></i> OPS <i data-lucide="chevron-down" width="14"></i>
      </button>
      <div id="ops-menu" class="dropdown" style="flex-direction: column;">
        <div class="dropdown-label">IT Installation</div>
        <div class="dropdown-columns">
          <div>
            <div class="dropdown-section-label"><i data-lucide="file-text" width="13"></i> FORMS</div>
            <button onclick="goTo('request')">Request</button>
          </div>
          <div>
            <div class="dropdown-section-label"><i data-lucide="folder-open" width="13"></i> RECORDS</div>
            <button onclick="goTo('answered')">Answered</button>
            <button onclick="goTo('archives')">Archives</button>
          </div>
          <div>
            <div class="dropdown-section-label"><i data-lucide="check-square" width="13"></i> ACTIONS</div>
            <button onclick="goTo('approval')">Approval</button>
          </div>
        </div>
      </div>
    </div>
    <div class="nav-group">
      <button id="settings-nav" class="nav-item" onclick="toggleMenu('settings')">
        <i data-lucide="settings" width="16"></i> Settings <i data-lucide="chevron-down" width="14"></i>
      </button>
      <div id="settings-menu" class="dropdown">
        <div>
          <div class="dropdown-section-label"><i data-lucide="settings" width="13"></i> WORKSPACE</div>
          <button onclick="goTo('general')">General</button>
          <button onclick="goTo('users')">Users &amp; roles</button>
        </div>
      </div>
    </div>
  </nav>

  <main id="app" class="container">
    <div id="page-content"></div>
  </main>
  <!-- Linked app.js -->
  <script src="app.js"></script>
</body>
</html>
